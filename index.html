<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap Carousel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    
    <div class="container-fluid p-0">
      <div class="card p-0 rounded-0 position-relative">
        <img src="Images/fruit bg.jpg" alt="" height="550px">
        <div class="card-img-overlay d-flex justify-content-center align-items-start flex-column">
          <div class="juice-text d-none d-md-block">
            <p>A Glass of Fresh Juice <br>Keep Your Healthy Everday</p>
            <h1>Fresh Juice</h1>
          </div>
        </div>
        <div class="position-absolute mycarousel">
          <div class="carousel slide" id="fruitCarousel"  data-bs-ride="carousel" data-bs-interval="1000">
            <div class="carousel-indicators">
              <button class="active" type="button" data-bs-target="#fruitCarousel" data-bs-slide-to="0"></button>
              <button type="button" data-bs-target="#fruitCarousel" data-bs-slide-to="1"></button>
              <button type="button" data-bs-target="#fruitCarousel" data-bs-slide-to="2"></button>
            </div>
            <div class="carousel-inner">
              <div class="carousel-item active">
                <img  src="Images/orange.png" alt="" height="500px">
              </div>
              <div class="carousel-item">
                <img  src="Images/water_melon.png" alt="" height="500px">
              </div>
              <div class="carousel-item">
                <img src="Images/kiwi.png" alt="" height="500px">
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
